<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interface de Mapa</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="findmap">
        <div class="rectangle1"></div>
        <div class="fundo"></div>
        <div class="referencia">REFERÊNCIA:</div>
        <div class="placeholder"></div>
        <div class="reference-image"></div>
        <div class="rectangle2"></div>
        <div class="recorte1"></div>
        <div class="coordenate">
            <div class="rectangle7"></div>
            <div class="copy-icon"></div>
            <div class="coordenada-text"> </div>
            <div class="coordenada-label">Coordenada:</div>
        </div>
        <div class="create-list">
            <div class="rectangle5"></div>
            <div class="create-list-text">Criar Lista</div>
        </div>
        <div class="start-button">
            <div class="rectangle5"></div>
            <div class="start-text">Iniciar</div>
        </div>
        <div class="historic">
            <div class="rectangle6"></div>
            <div class="historic-text">Histórico</div>
        </div>
        <div class="settings">
            <div class="settings-icon">?</div>
            <div class="settings-vector"></div>
        </div>
        <div class="info-box">
            <div class="rectangle9"></div>
            <div class="info-label">Info:</div>
        </div>
    </div>
    <script src="main.ts"></script>
</body>
</html>
